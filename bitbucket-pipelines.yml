image: sonarsource/sonar-scanner-cli:latest

definitions:
  caches:
    sonar: ~/.sonar/cache

pipelines:
  branches:
    live_2025:
      - step:
          name: SonarQube Analysis
          caches:
            - sonar
          script:
            - sonar-scanner

  pull-requests:
    '**':
      - step:
          name: SonarQube PR Analysis
          caches:
            - sonar
          script:
            - sonar-scanner
      - step:
          name: Post Results to PR
          image: alpine:latest
          script:
            - apk add --no-cache curl jq
            - sleep 30
            - |
              PROJECT_KEY="mediation"
              SONAR_URL="https://sonarqube.presolv360.com"
              
              ANALYSIS_RESULT=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}")
              MEASURES=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_URL}/api/measures/component?component=${PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,security_hotspots")
              
              STATUS=$(echo "$ANALYSIS_RESULT" | jq -r '.projectStatus.status // "UNKNOWN"')
              BUGS=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="bugs") | .value' 2>/dev/null)
              VULNS=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value' 2>/dev/null)
              SMELLS=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="code_smells") | .value' 2>/dev/null)
              COVERAGE=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="coverage") | .value' 2>/dev/null)
              DUPES=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value' 2>/dev/null)
              HOTSPOTS=$(echo "$MEASURES" | jq -r '.component.measures[] | select(.metric=="security_hotspots") | .value' 2>/dev/null)
              
              BUGS=${BUGS:-0}
              VULNS=${VULNS:-0}
              SMELLS=${SMELLS:-0}
              COVERAGE=${COVERAGE:-0}
              DUPES=${DUPES:-0}
              HOTSPOTS=${HOTSPOTS:-0}
              
              if [ "$STATUS" = "OK" ]; then STATUS_ICON="✅"; else STATUS_ICON="❌"; fi
              
              COMMENT="## ${STATUS_ICON} SonarQube Analysis Report

              **Quality Gate:** ${STATUS}

              | Metric | Value |
              |--------|-------|
              | Bugs | ${BUGS} |
              | Vulnerabilities | ${VULNS} |
              | Code Smells | ${SMELLS} |
              | Security Hotspots | ${HOTSPOTS} |
              | Coverage | ${COVERAGE}% |
              | Duplications | ${DUPES}% |

              [View Full Report](${SONAR_URL}/dashboard?id=${PROJECT_KEY})"
              
              curl -X POST \
                -H "Authorization: Bearer ${BB_AUTH_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$(jq -n --arg body "$COMMENT" '{content: {raw: $body}}')" \
                "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/pullrequests/${BITBUCKET_PR_ID}/comments"
